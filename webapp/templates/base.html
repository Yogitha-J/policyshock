<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}PolicyShock{% endblock %}</title>
<style>
  :root {
    --ink: #14181f; --muted: #5b6472; --line: #e3e7ee; --bg: #f6f7fb; --card: #ffffff;
    --accent: #1f5eff; --accent-ink: #0e3ac9; --good: #0f9d58; --warn: #b5620a; --bad: #d0342c;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header.top {
    padding: 22px 28px; border-bottom: 1px solid var(--line); background: var(--card);
    display: flex; align-items: baseline; gap: 12px;
  }
  header.top .mark { font-weight: 800; font-size: 19px; letter-spacing: -0.02em; }
  header.top .mark span { color: var(--accent); }
  header.top .tag { color: var(--muted); font-size: 13px; }
  main { max-width: 980px; margin: 0 auto; padding: 32px 20px 80px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 24px; margin-bottom: 20px;
  }
  h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -0.01em; }
  h2 { font-size: 17px; margin: 0 0 14px; }
  .muted { color: var(--muted); }
  .grid { display: grid; gap: 16px; }
  .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 720px) { .grid.cols-3, .grid.cols-2 { grid-template-columns: 1fr; } }
  .stat { border: 1px solid var(--line); border-radius: 12px; padding: 16px; background: #fafbfe; }
  .stat .n { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; }
  .stat .l { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 12.5px; text-transform: uppercase; letter-spacing: .03em; }
  tr:hover td { background: #f9fafc; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill.affected { background: #ffe9d9; color: var(--warn); }
  .pill.not_affected { background: #e3f6ea; color: var(--good); }
  .pill.unsupported { background: #ffe3e1; color: var(--bad); }
  button, .btn {
    font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card);
    padding: 9px 16px; border-radius: 9px; color: var(--ink); text-decoration: none; display: inline-block;
  }
  button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { background: var(--accent-ink); }
  a.rowlink { color: var(--accent-ink); cursor: pointer; text-decoration: underline dotted; }
  .banner { background: #fff8e6; border: 1px solid #f0d38a; border-radius: 10px; padding: 12px 14px; font-size: 13.5px; color: #6b4e05; }
  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(10,14,25,.45); align-items: center; justify-content: center; z-index: 20;
  }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--card); border-radius: var(--radius); padding: 22px; max-width: 520px; width: 92%; max-height: 82vh; overflow: auto; }
  .modal h3 { margin-top: 0; }
  .modal .close { float: right; background: none; border: none; font-size: 18px; }
  .kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; font-size: 13.5px; margin: 10px 0; }
  .kv b { color: var(--muted); font-weight: 600; }
  footer { text-align: center; color: var(--muted); font-size: 12.5px; padding: 20px; }
</style>
</head>
<body>
<header class="top">
  <div class="mark">Policy<span>Shock</span></div>
  <div class="tag">Replay a new government rule against your own transactions</div>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>Estimates based on the uploaded data and the policy rule set shown on this page. Not tax or legal advice.</footer>
{% block scripts %}{% endblock %}
</body>
</html>
